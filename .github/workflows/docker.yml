name: Docker

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# As upstream: one group per ref for the whole run, and a newer push waits instead of
# killing a build that is already pushing (pixel-nomad-infra pins these images by tag).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Upstream's Dockerfile ends in a `cloud` stage (their hosted product) and builds a
          # Rust runner; we ship `production`, amd64 only (the VPS), since v2026.1012.0.
          target: production
          # As upstream's production build: stamps the commit into dist/build-info.json and the
          # image env, and qualifies the runner provider pack. Without it the image is unstamped.
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GH_PACKAGES_TOKEN: PAT with read:packages. The ephemeral
          # GITHUB_TOKEN cannot read the internal hermes-paperclip-adapter
          # package (owned by another repo; access grant is UI-only), so
          # pnpm install inside the build 401s without this.
          secrets: |
            GITHUB_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}

      # As upstream: PID 1 must be an init that reaps adopted orphans. Every Paperclip task
      # here is a `docker exec` from the hermes stub; unreaped orphans pin as zombies until
      # the cgroup pid limit is reached and every fork() in the container fails.
      - name: Verify PID 1 reaps orphaned processes
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          test -n "$image"
          echo "Verifying orphan reaping in $image"
          docker run --rm -i --pull always "$image" sh -s < scripts/assert-orphan-reaping.sh
